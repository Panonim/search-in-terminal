name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v1.2.0"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
          - { goos: freebsd, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          SHA="${GITHUB_SHA}"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          BIN=sit
          if [ "$GOOS" = "windows" ]; then BIN=sit.exe; fi

          mkdir -p build dist
          go build -trimpath \
            -ldflags "-s -w -X main.version=${TAG} -X main.commit=${SHA} -X main.date=${BUILD_DATE}" \
            -o "build/${BIN}" ./cmd/sit

          for f in README.md LICENSE; do
            if [ -f "$f" ]; then cp "$f" build/; fi
          done

          NAME="sit_${VERSION}_${GOOS}_${GOARCH}"
          if [ "$GOOS" = "windows" ]; then
            (cd build && zip -q -r "../dist/${NAME}.zip" .)
          else
            tar -czf "dist/${NAME}.tar.gz" -C build .
          fi
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  installer:
    name: installer
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Reuse installer from previous release
        id: reuse
        run: |
          set -euo pipefail
          mkdir -p dist
          PREV="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV" ] && git diff --quiet "$PREV" "$TAG" -- install.go \
            && gh release download "$PREV" --repo "$GITHUB_REPOSITORY" --pattern 'sit-install_*' --dir dist; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
            echo "install.go unchanged since ${PREV}, reusing its installers"
          fi

      - uses: actions/setup-go@v5
        if: steps.reuse.outputs.reused != 'true'
        with:
          go-version-file: go.mod
          cache: true

      - name: Build installers
        if: steps.reuse.outputs.reused != 'true'
        run: |
          set -euo pipefail
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64 freebsd/amd64; do
            GOOS="${target%/*}" GOARCH="${target#*/}"
            EXT=""
            if [ "$GOOS" = "windows" ]; then EXT=.exe; fi
            CGO_ENABLED=0 GOOS="$GOOS" GOARCH="$GOARCH" \
              go build -trimpath -ldflags "-s -w" -o "dist/sit-install_${GOOS}_${GOARCH}${EXT}" install.go
          done

      - run: ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-installer
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [build, installer]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: dist-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum sit_* | sort -k2 > checksums.txt
          cat checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: dist/*
          generate_release_notes: true
